<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Festbüro</title>
    <!--
      CSP: komplett offline. 'unsafe-inline' für Skripte ist nötig, weil die Rechnungsvorschau (srcdoc-iframe)
      die CSP erbt und ein Inline-Skript für den Seitenumbruch enthält. Keine externen Quellen.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' data: blob: about:; object-src 'none'; base-uri 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
